[package]
name = "photocraft-algo"
description = "Depth-agnostic, tile-aware CPU image filters (blur, sharpen, noise, distort, stylize)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
serde = { workspace = true }
rustfft = "6.4.1"
# Self-logging (ours, never offered upstream): stage marks for the stall watch. No dependencies.
craft-stage = { path = "../craft-stage" }

# Parallel tiles on native; wasm builds stay single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
